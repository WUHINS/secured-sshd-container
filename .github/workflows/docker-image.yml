name: Build and Push Secured SSHD Container

on:
  # 推送代码到 main 分支时触发 (可根据需要调整分支名)
  push:
    branches: [ "main" ]
  # 创建新版本标签时触发 (例如 git tag v1.0.0 && git push origin v1.0.0)
  tags: [ "v*.*.*" ]
  # 允许在 GitHub 页面上手动触发工作流
  workflow_dispatch:
    inputs:
      image-tag:
        description: '请输入镜像标签 (例如: latest, v1.0.0)'
        required: true
        default: 'latest'

env:
  # 镜像将推送至 GitHub Container Registry (ghcr.io)
  REGISTRY: ghcr.io
  # 镜像名称格式: ghcr.io/你的用户名/仓库名
  # 请将 'WUHINS' 替换为您的 GitHub 用户名，'secured-sshd-container' 可替换为您的镜像名称
  IMAGE_NAME: ghcr.io/WUHINS/secured-sshd-container

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # 为确保安全扫描结果上传等工作正常，配置所需权限 [3](@ref)
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 使用 GitHub 令牌进行认证，无需额外配置密码 [3](@ref)
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 根据触发事件类型自动生成标签
            type=ref,event=branch    # 分支推送时，标签为分支名
            type=ref,event=pr         # Pull Request 时（如需）
            type=semver,pattern={{version}}  # 版本标签（如 v1.0.0 -> 1.0.0）
            type=semver,pattern={{major}}.{{minor}} # 主次版本标签（如 1.0）
            type=raw,value=latest,enable={{is_default_branch}} # 默认分支推送时额外打上 latest 标签
            type=raw,value=${{ github.event.inputs.image-tag }} # 兼容手动触发时输入的标签

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文为代码根目录，请确保 Dockerfile 在此位置 [2](@ref)
          # 构建并推送支持 linux/amd64 和 linux/arm64 架构的镜像 [1,3](@ref)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }} # 使用上一步生成的标签
          labels: ${{ steps.meta.outputs.labels }}
          # 启用缓存以加速后续构建 [3](@ref)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          # 可选：可调整扫描策略，例如仅导致关键和高危漏洞时失败
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Scan Results to GitHub Security Tab
        # 即使上一步扫描失败（发现漏洞），也上传结果以便查看报告
        if: always()
        uses: github/codeql-action/upload-sarif@v4 # 使用 v4 版本以避免弃用警告
        with:
          sarif_file: trivy-results.sarif
