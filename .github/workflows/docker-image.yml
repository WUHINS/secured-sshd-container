name: Build and Push Secured SSHD Container

on:
  # 允许在 GitHub 网页上手动触发工作流，并可输入参数
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker 镜像标签'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  # 镜像名称格式：ghcr.io/你的用户名/你的镜像名
  # 请将 WUHINS 替换为您的 GitHub 用户名
  IMAGE_NAME: ghcr.io/WUHINS/secured-sshd-container

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          # 关键修复：使用元数据步骤输出的第一个有效标签，避免格式错误
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # 明确指定扫描架构，避免多平台歧义
          TRIVY_PLATFORM: linux/amd64

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        # 确保仅在 Trivy 扫描步骤成功生成报告后上传
        if: success()
        with:
          sarif_file: trivy-results.sarif
