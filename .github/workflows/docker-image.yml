name: Build and Push Secured SSHD Container

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker 镜像标签'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  # 请将 WUHINS 替换为您的 GitHub 用户名
  IMAGE_NAME: ghcr.io/WUHINS/secured-sshd-container

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 获取仓库代码
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx 环境，支持多架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 为镜像生成元数据和标签
      - name: Extract Metadata for Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. 构建并推送 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
